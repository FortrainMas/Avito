[project]
name = "avito"
version = "0.1.0"
description = "Кандидатогенерация для поиска услуг Авито: BM25 + дообученный эмбеддер + LightGBM"
readme = "README.md"
authors = [
    { name = "Ivan Shebanov", email = "vanamokanov8@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm==4.6.0",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pystemmer>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
gpu = [
    "sentence-transformers[train]>=6.1.0",
    "torch==2.8.0",
]

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
    "nbformat>=5.11.1",
]

[tool.pylint."messages control"]
disable = [
    "expression-not-assigned",
    "pointless-statement",
    "missing-class-docstring",
    "missing-function-docstring",
    "attribute-defined-outside-init"
]
